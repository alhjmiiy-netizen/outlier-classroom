<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Terminal — Outlier Classroom mock-up</title>
<style>
:root{--g:#33ff88;--a:#ffb000;--dim:#1f7a45;--bg:#050806}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--g);font:15px/1.5 ui-monospace,"Fira Code",Menlo,Consolas,monospace;text-shadow:0 0 4px #33ff8855}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 2px,#0004 2px 3px)}
main{max-width:980px;margin:auto;padding:14px}.bar{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--dim);padding-bottom:8px}a,button.l{color:var(--a);background:none;border:1px solid #5a3f00;padding:4px 10px;font:inherit;cursor:pointer;text-decoration:none}button.l:hover{background:#2a1d00}
.amb{color:var(--a)}.dim{color:var(--dim)}pre{white-space:pre-wrap;margin:0}.box{border:1px solid var(--dim);padding:12px;margin:12px 0}h2{color:var(--a);font-size:1.05rem;margin:.8em 0 .3em}h2:before{content:"## "}
.q{margin:10px 0}.qt{color:#d8ffe6}.opt{display:block;width:100%;text-align:left;background:none;color:var(--g);border:1px solid #123d24;margin:3px 0;padding:6px 10px;font:inherit;cursor:pointer}.opt:before{content:"[ ] "}.opt.sel{border-color:var(--a);color:var(--a)}.opt.sel:before{content:"[x] "}.opt.right{border-color:var(--g)}.opt.wrong{border-color:#ff4d4d;color:#ff8080}.fb{color:var(--dim)}
.cmd{display:flex;gap:6px;margin-top:12px;border-top:1px solid var(--dim);padding-top:8px}.cmd input{flex:1;background:none;border:none;color:var(--g);font:inherit;outline:none}.timer{color:var(--a);font-weight:bold}.timer.low{color:#ff4d4d}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}.m{border:1px solid #123d24;padding:6px 8px;cursor:pointer}.m:hover{border-color:var(--a)}.m.a{border-color:var(--a);color:var(--a)}.big{font-size:2.6rem;color:var(--a)}
table{border-collapse:collapse;width:100%}td,th{padding:3px 8px;text-align:left;border-bottom:1px dashed #123d24}ul{margin:.2em 0;padding-left:1.4em}li::marker{content:"> "}
</style></head><body><main><div class="bar"><span class="amb">outlier@classroom:~$</span><button class="l" data-c="missions">missions</button><button class="l" data-c="grades">grades</button><button class="l" data-c="resume">resume</button><button class="l" data-c="help">help</button></div><div id="out"></div>
<div class="cmd"><span class="amb">&gt;</span><input id="cin" placeholder="type: missions | open 4 | warmup 4 | brief 4 | test 4 | grades | resume | help" autocapitalize="off" autocomplete="off"></div></main>
<script src="../../lessons.js"></script><script src="../../extra1.js"></script><script src="../../extra2.js"></script><script src="../shared/core.js"></script>
<script>
const st=MK.load('oc-mockup-terminal'),L=MK.L,X=MK.X,$=s=>document.querySelector(s),out=$('#out'),E=MK.esc;let stop=()=>{};
const tag=s=>({a:'[A★]',pass:'[OK]',tried:'[RETRY]',read:'[READ]',none:'[    ]'}[s]);
function boot(){const g=st.greeting(),lines=['OUTLIER CLASSROOM OS v3.0 ...... booting','loading curriculum: 16 modules ......... OK','mounting progress store ............... OK'+(g.demo?'  (DEMO DATA)':''),'',`> Welcome back, Lord.`,`> streak: ${g.streak} days 🔥`,`> last checkpoint: ${g.where}`,'',`type "resume" or "missions" to continue.`];
 out.innerHTML='<pre id="boot" class="box"></pre>';let i=0;const pre=$('#boot');const t=setInterval(()=>{if(i>=lines.length){clearInterval(t);pre.innerHTML+=`<button class="l" onclick="run('resume')">resume ▸</button> <button class="l" onclick="run('missions')">missions ▸</button>`;return}pre.innerHTML+=E(lines[i++])+'\n'},90)}
function missions(){out.innerHTML=`<div class="box"><span class="amb">MISSION BOARD</span> <span class="dim">— click a mission or type "open N"</span><div class="grid" style="margin-top:8px">${L.map((l,i)=>{const s=st.status(l.skill);return `<div class="m ${s==='a'?'a':''}" onclick="run('open ${i+1}')">${tag(s)} M${String(i+1).padStart(2,'0')} ${E(l.skill)}${l.hw?' <span class="dim">[HW]</span>':''}</div>`}).join('')}</div></div>`}
function open(d){const l=L[d-1];if(!l)return err('no such mission');st.touch(d,'Briefing');const x=X[l.skill];
 out.innerHTML=`<div class="box"><div class="amb">MISSION ${String(d).padStart(2,'0')} :: ${E(l.skill.toUpperCase())} — ${E(l.title)}</div>${l.hw?'<div class="dim">// class: HARDWARE. you are describing circuits, not instructions.</div>':''}
 <h2>brief</h2><div>${E(l.why)}</div><h2>objectives</h2><ul><li>clear the warm-up (recall ${d>1?E(L[d-2].skill):'basics'})</li><li>study the intel: ${E(l.concepts.slice(0,3).join('; '))}…</li><li>pass the timed test — target: A (90%+)</li></ul>
 <div style="margin-top:10px"><button class="l" onclick="run('warmup ${d}')">warmup ${d}</button> <button class="l" onclick="run('brief ${d}')">read intel</button> <button class="l" onclick="run('test ${d}')">test ${d}</button></div></div>`}
function warm(d){st.touch(d,'Warm-up');out.innerHTML=`<div class="box"><div class="amb">WARM-UP :: ${d>1?'recall '+E(L[d-2].skill):'boot check'}</div><div id="wq"></div><button class="l" onclick="run('brief ${d}')">continue → intel</button></div>`;MK.quiz($('#wq'),MK.warm(d),{instant:true})}
function brief(d){const l=L[d-1],x=X[l.skill];st.touch(d,'Learning');st.s.read[l.skill]=1;st.save();
 out.innerHTML=`<div class="box"><div class="amb">INTEL :: ${E(l.skill)}</div><h2>the big idea</h2><div>${E(l.breakdown)}</div><h2>fundamentals</h2><div>${E(x.fund)}</div><h2>priority</h2><div class="amb">${E(x.matters)}</div><h2>key concepts</h2><ul>${l.concepts.map(c=>`<li>${E(c)}</li>`).join('')}</ul><h2>do</h2><ul>${x.dos.map(c=>`<li>${E(c)}</li>`).join('')}</ul><h2>don't</h2><ul>${x.donts.map(c=>`<li>${E(c)}</li>`).join('')}</ul><h2>known failure modes</h2><ul>${x.mistakes.map(c=>`<li>${E(c)}</li>`).join('')}</ul><button class="l" onclick="run('test ${d}')">engage test ▸</button></div>`}
function test(d){stop();const l=L[d-1],qs=MK.test(l.skill);st.touch(d,'Test');
 out.innerHTML=`<div class="box"><div class="amb">TEST :: ${E(l.skill)} · ${qs.length} items · time left <span class="timer" id="tm"></span></div><div id="tq"></div><button class="l" id="sub">submit ▸</button></div>`;
 const ans=MK.quiz($('#tq'),qs);const fin=()=>{stop();const r=MK.score(qs,ans),g=MK.letter(r.pct);st.grade(l.skill,r.pct);
  out.innerHTML=`<div class="box"><pre class="${r.pct>=90?'amb':''}">${r.pct>=70?'█ MISSION COMPLETE':'█ MISSION FAILED — retry available'}\n  grade: <span class="big">${g}</span>  (${r.ok}/${qs.length} · ${r.pct}%)\n  ${r.pct>=90?'A achieved. module marked ★':'target is A (90%+).'}</pre></div><div class="box">${MK.review(qs,ans)}</div><button class="l" onclick="run('missions')">missions ▸</button>`};
 stop=MK.timer(480,$('#tm'),fin);$('#sub').onclick=fin}
function grades(){out.innerHTML=`<div class="box"><div class="amb">REPORT :: GPA ${st.gpa()} · A's ${L.filter(l=>st.status(l.skill)==='a').length}/16 · streak ${st.s.streak}</div><table><tr><th>#</th><th>module</th><th>grade</th><th>status</th></tr>${L.map((l,i)=>{const p=st.s.grades[l.skill];return `<tr><td>${i+1}</td><td>${E(l.skill)}</td><td class="${p>=90?'amb':''}">${MK.letter(p)}${p!=null?' '+p+'%':''}</td><td>${tag(st.status(l.skill))}</td></tr>`}).join('')}</table></div>`}
function err(m){out.insertAdjacentHTML('afterbegin',`<div class="box" style="color:#ff8080">error: ${E(m)}</div>`)}
function run(c){stop();const [cmd,n]=c.trim().toLowerCase().split(/\s+/),d=+n||st.s.last.day;
 if(cmd==='missions'||cmd==='ls')missions();else if(cmd==='open')open(d);else if(cmd==='warmup')warm(d);else if(cmd==='brief'||cmd==='read')brief(d);else if(cmd==='test')test(d);else if(cmd==='grades')grades();
 else if(cmd==='resume'){const m=st.s.last.mode;m==='Test'?test(d):m==='Warm-up'?warm(d):m==='Learning'?brief(d):open(d)}
 else if(cmd==='help')out.innerHTML=`<pre class="box">commands:\n  missions        list all 16 missions\n  open N          mission brief + objectives\n  warmup N        recall quiz\n  brief N         read the lesson intel\n  test N          timed test (8:00)\n  grades          report card\n  resume          jump to where you left off</pre>`;
 else err('unknown command: '+cmd);window.scrollTo(0,0)}
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>run(b.dataset.c));$('#cin').onkeydown=e=>{if(e.key==='Enter'){run(e.target.value);e.target.value=''}};
boot();
</script></body></html>
